# HMIS stack (docs/01 §1). Run from the repo root:
#   docker compose --env-file .env -f infra/docker/docker-compose.yml up -d --build
# Every host port comes from .env (see .env.example), so several stacks can share one host
# when each has its own COMPOSE_PROJECT_NAME and ports.
name: ${COMPOSE_PROJECT_NAME:-hmis}

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-hmis}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-hmis}

x-app-env: &app-env
  <<: *db-env
  # In-network address; resolveDatabaseUrl() builds and escapes the URL from these.
  PG_HOST: postgres
  PG_PORT: '5432'
  # Least-privileged app login (member of hmis_app); created/updated by the migrate step.
  APP_DB_USER: ${APP_DB_USER:-hmis_app_login}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
  HMIS_VERSION: ${HMIS_VERSION:-dev}
  # TOTP seed encryption (FND-02); never commit a real value.
  HMIS_SECRET_KEY: ${HMIS_SECRET_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TZ: Asia/Kolkata

services:
  postgres:
    image: ${PG_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: Postgres is reachable only on the compose network (docs/01 §9).
    # docker-compose.dev.yml publishes it on 127.0.0.1:${PG_PORT} for local development.

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: ${HMIS_IMAGE_PREFIX:-hmis}/web:${HMIS_VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      # Photos of paper prescriptions (OPD-02) are written here; the worker shares the volume.
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only (local health checks / debugging). LAN clients go through Caddy (HTTPS).
      - '127.0.0.1:${WEB_PORT:-3000}:3000'

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    image: ${HMIS_IMAGE_PREFIX:-hmis}/worker:${HMIS_VERSION:-dev}
    restart: unless-stopped
    init: true
    environment:
      <<: *app-env
      # MSG-01: Meta Cloud API login; empty keeps WhatsApp messages queued.
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
    volumes:
      # Rendered PDFs and Rx photos (docs/01 §2), shared with web. Backed up with the database (OPS-01).
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    environment:
      HMIS_HOSTNAME: ${HMIS_HOSTNAME:-hmis.local}
    ports:
      - '${CADDY_HTTPS_PORT:-443}:443'
      - '${CADDY_HTTP_PORT:-80}:80'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  backup:
    # Placeholder until OPS-01 (pgBackRest WAL archive + nightly full, restic for files;
    # docs/31 §3). Same image as postgres so pg_dump/psql versions match.
    image: ${PG_IMAGE:-postgres:17}
    restart: unless-stopped
    init: true
    environment:
      <<: *db-env
      PGHOST: postgres
    command:
      ['sh', '-c', 'echo "backup: placeholder, nothing scheduled (OPS-01)"; exec sleep infinity']
    volumes:
      - backup:/backup
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
  backup:
