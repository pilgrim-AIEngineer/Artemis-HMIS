# HMIS stack (docs/01 §1). Run from the repo root:
#   docker compose --env-file .env -f infra/docker/docker-compose.yml up -d --build
# Every host port comes from .env (see .env.example), so several stacks can share one host
# when each has its own COMPOSE_PROJECT_NAME and ports.
name: ${COMPOSE_PROJECT_NAME:-hmis}

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-hmis}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-hmis}

x-app-env: &app-env
  <<: *db-env
  # In-network address; resolveDatabaseUrl() builds and escapes the URL from these.
  PG_HOST: postgres
  PG_PORT: '5432'
  # Least-privileged app login (member of hmis_app); created/updated by the migrate step.
  APP_DB_USER: ${APP_DB_USER:-hmis_app_login}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
  HMIS_VERSION: ${HMIS_VERSION:-dev}
  # TOTP seed encryption (FND-02); never commit a real value.
  HMIS_SECRET_KEY: ${HMIS_SECRET_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TZ: Asia/Kolkata
  # OPS-01: where /api/health and the ops.* jobs find the backup status (written by `backup`).
  HMIS_BACKUP_STATUS_FILE: /backup/status/status.json
  HMIS_DISK_PATHS: /data/files,/backup
  OPS_BACKUP_MAX_AGE_HOURS: ${OPS_BACKUP_MAX_AGE_HOURS:-24}
  OPS_FILES_MAX_AGE_HOURS: ${OPS_FILES_MAX_AGE_HOURS:-36}
  OPS_CLOUD_MAX_LAG_HOURS: ${OPS_CLOUD_MAX_LAG_HOURS:-48}
  OPS_USB_ROTATION_DAYS: ${OPS_USB_ROTATION_DAYS:-8}
  OPS_DISK_WARN_USED_PCT: ${OPS_DISK_WARN_USED_PCT:-80}
  OPS_DISK_CRITICAL_USED_PCT: ${OPS_DISK_CRITICAL_USED_PCT:-90}
  OPS_QUEUE_BACKLOG_MAX: ${OPS_QUEUE_BACKLOG_MAX:-500}

services:
  postgres:
    image: ${PG_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: Postgres is reachable only on the compose network (docs/01 §9).
    # docker-compose.dev.yml publishes it on 127.0.0.1:${PG_PORT} for local development.

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: ${HMIS_IMAGE_PREFIX:-hmis}/web:${HMIS_VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      # Photos of paper prescriptions (OPD-02) are written here; the worker shares the volume.
      - files:/data/files
      # Read-only: /api/health reports the last backup age and the free disk space.
      - backup:/backup:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only (local health checks / debugging). LAN clients go through Caddy (HTTPS).
      - '127.0.0.1:${WEB_PORT:-3000}:3000'

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    image: ${HMIS_IMAGE_PREFIX:-hmis}/worker:${HMIS_VERSION:-dev}
    restart: unless-stopped
    init: true
    environment:
      <<: *app-env
      # MSG-01: Meta Cloud API login; empty keeps WhatsApp messages queued.
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      # OPS-01 monitoring (all optional; empty = log only / no ping). Never commit real values.
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_TELEGRAM_BOT_TOKEN: ${OPS_TELEGRAM_BOT_TOKEN:-}
      OPS_TELEGRAM_CHAT_ID: ${OPS_TELEGRAM_CHAT_ID:-}
      OPS_ALERT_LABEL: ${OPS_ALERT_LABEL:-}
      OPS_ALERT_REPEAT_HOURS: ${OPS_ALERT_REPEAT_HOURS:-6}
      HMIS_HOSTNAME: ${HMIS_HOSTNAME:-hmis.local}
    volumes:
      # Rendered PDFs and Rx photos (docs/01 §2), shared with web. Backed up with the database (OPS-01).
      - files:/data/files
      - backup:/backup:ro
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    environment:
      HMIS_HOSTNAME: ${HMIS_HOSTNAME:-hmis.local}
    ports:
      - '${CADDY_HTTPS_PORT:-443}:443'
      - '${CADDY_HTTP_PORT:-80}:80'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  backup:
    # OPS-01 (docs/31 §3): scheduled pg_dump + restic (encrypted) to /backup (second SSD volume),
    # the rotating USB disk and an S3-compatible bucket. Same image family as postgres so
    # pg_dump/pg_restore versions match.
    build:
      context: ./backup
      args:
        PG_IMAGE: ${PG_IMAGE:-postgres:17}
    image: ${HMIS_IMAGE_PREFIX:-hmis}/backup:${HMIS_VERSION:-dev}
    restart: unless-stopped
    init: true
    environment:
      <<: *db-env
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-hmis}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-hmis}
      # Encrypts every restic repository. Losing it makes the backups unreadable: keep a copy offline.
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in .env (install.sh generates one)}
      BACKUP_AT: ${BACKUP_AT:-02:00}
      BACKUP_DB_EVERY_MIN: ${BACKUP_DB_EVERY_MIN:-60}
      BACKUP_USB_ENABLED: ${BACKUP_USB_ENABLED:-0}
      # Offsite copy, e.g. s3:https://s3.ap-south-1.amazonaws.com/<bucket>/hmis (empty = off).
      BACKUP_S3_REPOSITORY: ${BACKUP_S3_REPOSITORY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
    volumes:
      - backup:/backup
      - files:/data/files:ro
      # The rotating USB disk, mounted on the host at BACKUP_USB_HOST_DIR (install.sh sets this
      # up). rslave: a disk mounted after the container started still shows up.
      - type: bind
        source: ${BACKUP_USB_HOST_DIR:-/mnt/hmis-usb}
        target: /usb
        bind:
          propagation: rslave
          create_host_path: true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
  backup:
