name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Integration tests start their own Postgres 17 with Testcontainers (runner's Docker).
      - run: pnpm test

      - run: pnpm check:forbidden

      - run: pnpm build

      - name: Validate compose files
        run: >
          docker compose --env-file .env.example
          -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.dev.yml config -q

      - name: Install Playwright Chromium
        run: pnpm --filter @hmis/web exec playwright install --with-deps chromium

      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
